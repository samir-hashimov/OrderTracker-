services:
  postgres:
    image: postgres:15-alpine
    container_name: ordertracker-postgres
    restart: always
    environment:
      POSTGRES_DB: ordertracker
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ordertracker-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordertracker-app
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/ordertracker
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRATION=${ACCESS_TOKEN_EXPIRATION}
      - JWT_REFRESH_TOKEN=${JWT_REFRESH_TOKEN}
    networks:
      - ordertracker-network

volumes:
  postgres_data:

networks:
  ordertracker-network:
    driver: bridge