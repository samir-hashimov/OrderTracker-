spring:
  application:
    name: OrderTracker

  # PostgreSQL Database
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Hibernate & JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Settings
jwt:
  secret: ${JWT_SECRET}
  refresh:
    token: ${JWT_REFRESH_TOKEN}
  access:
    token: ${ACCESS_TOKEN_EXPIRATION}

# Logging
logging:
  level:
    root: INFO
    com.ordertracker: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html